<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Nusa Explorer - Game Godot</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #0d061f;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #ffffff;
    }
    #canvas-container {
      position: relative;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at center, #2e1065 0%, #0d061f 100%);
      text-align: center;
      padding: 20px;
    }
    .pixel-box {
      background: rgba(255, 255, 255, 0.08);
      border: 3px solid #7c3aed;
      border-radius: 20px;
      padding: 32px 24px;
      max-width: 540px;
      box-shadow: 0 12px 36px rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(8px);
    }
    .badge {
      display: inline-block;
      background: #7c3aed;
      color: #ffd700;
      font-weight: 800;
      font-size: 13px;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      padding: 6px 16px;
      border-radius: 999px;
      margin-bottom: 16px;
      border: 1px solid rgba(255, 255, 255, 0.2);
    }
    h1 {
      font-size: 24px;
      margin-bottom: 12px;
      color: #ffffff;
      text-shadow: 0 2px 4px rgba(0,0,0,0.5);
    }
    p {
      font-size: 14px;
      line-height: 1.6;
      color: #d8b4fe;
      margin-bottom: 20px;
    }
    .loader {
      display: inline-block;
      width: 48px;
      height: 48px;
      border: 4px solid rgba(255, 255, 255, 0.15);
      border-radius: 50%;
      border-top-color: #ffd700;
      animation: spin 1s ease-in-out infinite;
      margin-bottom: 16px;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .info-tag {
      display: inline-block;
      font-size: 11px;
      color: #94a3b8;
      background: rgba(0,0,0,0.3);
      padding: 6px 12px;
      border-radius: 8px;
    }
  </style>
</head>
<body>
  <div id="canvas-container">
    <div class="pixel-box">
      <div class="loader"></div>
      <div class="badge">Godot Engine</div>
      <h1>Nusa Explorer HTML5</h1>
      <p>Iframe siap memuat game Godot HTML5 Anda. Letakkan file hasil export Godot (<code>index.html</code>, <code>index.js</code>, <code>index.wasm</code>, <code>index.pck</code>) di folder ini.</p>
      <div class="info-tag">Lokasi Target: <code>public/game/index.html</code></div>
    </div>
  </div>
</body>
</html>
